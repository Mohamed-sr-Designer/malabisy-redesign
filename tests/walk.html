<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walkthrough capture fixture (test only, not linked)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100vw;height:100vh;display:block}</style>
</head>
<body>
<iframe id="f" title="capture"></iframe>
<script>
/* Test-only: drives real pages into specific states for video screenshots. Used by videos/remotion/scripts/capture-walk.mjs */
const P = new URLSearchParams(location.search), s = P.get("s");
const f = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const W = () => f.contentWindow, Dq = (q) => f.contentDocument.querySelector(q);
const load = (url) => new Promise((r) => { f.onload = () => r(); f.src = url; });
const session = () => localStorage.setItem("mlb_admin_sess", JSON.stringify({ uid: "u-super", at: Date.now(), exp: Date.now() + 8 * 3600e3 }));
const bag = (n = 3) => { const C = W().MLB_API.catalog; const pick = [C.find((r) => /Toggle-Front Leather Jacket – Brown/.test(r.t)), C.find((r) => r.v === "KAVA" && r.a.length && r.p > 600), C.find((r) => r.v === "Carinawear" && r.a.length && /Knit|Sweater|Pullover/i.test(r.t))].filter(Boolean).slice(0, n); pick.forEach((r) => W().MLB_API.addToBag(r.h, r.a[0] || "One size")); };
const scroll = (y) => W().scrollTo(0, y);
// scroll-in animations never fire in a headless capture: show those blocks in their final state
setInterval(() => { try { const d = f.contentDocument; d.querySelectorAll(".rv").forEach((e) => e.classList.add("in")); if (!d.getElementById("cap-still")) { const st = d.createElement("style"); st.id = "cap-still"; st.textContent = "*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important}"; d.head.appendChild(st); } } catch {} }, 100);
const S = {
  async home() { localStorage.clear(); await load("/index.html"); await wait(1500); },
  async homeChoices() { await load("/index.html"); await wait(1200); const el = [...f.contentDocument.querySelectorAll("section")].find((x) => /Malabisy Label/.test(x.textContent) && /Marketplace/.test(x.textContent) && x.getBoundingClientRect().top > 300); if (el) el.scrollIntoView(); await wait(900); },
  async search() { await load("/index.html"); await wait(1200); Dq("#searchBtn").click(); await wait(400); const q = Dq("#q"); q.value = "coat"; q.dispatchEvent(new Event("input", { bubbles: true })); await wait(1500); },
  async market() { await load("/marketplace.html?g=Women"); await wait(2000); },
  async brands() { await load("/brands.html"); await wait(1800); },
  async product() { await load("/index.html"); await wait(800); const C = W().MLB_API.catalog; const r = C.find((x) => /High-Collar Belted Trench Coat – Beige/.test(x.t)) || C.find((x) => /coat/i.test(x.t) && x.a.length > 1); await load("/product.html?h=" + encodeURIComponent(r.h)); await wait(2000); },
  async stylist() { await load("/index.html"); await wait(1500); sessionStorage.clear(); W().MLB_STYLIST.open(); await wait(500); W().MLB_STYLIST.respond("Office look under LE 2,000"); await wait(4000); const log = Dq(".mst-log"); if (log) log.scrollTop = log.scrollHeight - log.clientHeight - 260; await wait(1200); },
  async bag() { localStorage.removeItem("mlb2_bag"); await load("/index.html"); await wait(1200); bag(3); await wait(4500); Dq("#bagBtn").click(); await wait(2500); },
  async checkout() { await load("/bag.html"); await wait(1800); },
  async payment() { await load("/bag.html"); await wait(1200); Dq("#toDelivery").click(); await wait(300); const fd = Dq("#fDel"); const ins = fd.querySelectorAll("input"); ["Nour", "Adel", "01012345678", "nour@example.com", "Heliopolis", "12 El Nozha St, floor 3"].forEach((v, i) => (ins[i].value = v)); fd.requestSubmit(); await wait(3000); },
  async invoice() { await load("/bag.html"); await wait(1200); Dq("#toDelivery").click(); await wait(300); const fd = Dq("#fDel"); const ins = fd.querySelectorAll("input"); ["Nour", "Adel", "01012345678", "nour@example.com", "Heliopolis", "12 El Nozha St, floor 3"].forEach((v, i) => (ins[i].value = v)); fd.requestSubmit(); await wait(500); Dq("#fPay").requestSubmit(); await wait(1500); Dq("#invoice").scrollIntoView(); W().scrollBy(0, -20); await wait(800); },
  async account() { localStorage.setItem("mlb2_user", JSON.stringify({ name: "Nour Adel", email: "nour@example.com", phone: "", since: new Date().toISOString() })); await load("/account.html#orders"); await wait(1800); },
  async sell() { await load("/sell.html"); await wait(1800); },
  async login() { localStorage.removeItem("mlb_admin_sess"); await load("/admin.html"); await wait(1500); },
  async dash() { session(); const n = JSON.parse(localStorage.getItem("mlb2_orders") || "[]").filter((o) => o.sample).length; if (!n) { await load("/admin.html#settings"); await wait(1500); const b = Dq("#sm-add"); if (b) { b.click(); await wait(1500); } } await load("/admin.html#dashboard"); await wait(2000); },
  async dashLow() { session(); await load("/admin.html#dashboard"); await wait(1800); scroll(+(P.get("y") || 900)); await wait(600); },
  async orders() { session(); await load("/admin.html#orders?s=Placed"); await wait(1500); const sel = [...f.contentDocument.querySelectorAll("[data-st]")]; if (sel[0]) { sel[0].value = "Confirmed"; sel[0].dispatchEvent(new Event("change")); await wait(900); } const sel2 = [...f.contentDocument.querySelectorAll("[data-st]")]; if (sel2[0]) { sel2[0].value = "Shipped"; sel2[0].dispatchEvent(new Event("change")); await wait(900); } W().location.hash = "#orders"; await wait(1800); [...f.contentDocument.querySelectorAll("[data-sel]")].slice(1, 4).forEach((c) => { c.checked = true; c.dispatchEvent(new Event("change")); }); await wait(800); },
  async order() { session(); const o = JSON.parse(localStorage.getItem("mlb2_orders") || "[]").find((x) => x.status === "Confirmed" || x.status === "Placed"); await load("/admin.html#orders/" + (o ? o.no : "")); await wait(1800); },
  async products() { session(); await load("/admin.html#products?f=sale"); await wait(1500); [...f.contentDocument.querySelectorAll("[data-sel]")].slice(0, 3).forEach((c) => { c.checked = true; c.dispatchEvent(new Event("change")); }); await wait(800); },
  async productEdit() { session(); await load("/admin.html#products/high-collar-belted-trench-coat-beige"); await wait(1200); if (/Not found/.test(f.contentDocument.body.textContent)) { const C = window.MLB_CATALOG || []; } await wait(600); },
  async brandsAdmin() { session(); await load("/admin.html#brands"); await wait(1800); },
  async customers() { session(); await load("/admin.html#customers?seg=vip"); await wait(1800); },
  async discounts() { session(); await load("/admin.html#dashboard"); await wait(1000); const st = W().MLB_CMS.store, d = JSON.parse(JSON.stringify(st.get())); d.discounts = [{ code: "EID20", type: "percent", value: 20, min: 1500, ends: new Date(Date.now() + 9 * 864e5).toISOString().slice(0, 16), on: true }, { code: "WELCOME10", type: "percent", value: 10, min: "", ends: "", on: true }, { code: "FREESHIP", type: "ship", value: 0, min: 1000, ends: "", on: true }, { code: "WINTER300", type: "fixed", value: 300, min: 2500, ends: new Date(Date.now() - 2 * 864e5).toISOString().slice(0, 16), on: true }]; st.save(d); await load("/admin.html#discounts"); await wait(1800); },
  async content() { session(); await load("/admin.html#content"); await wait(3000); },
  async editor() { session(); sessionStorage.clear(); await load("/index.html?edit"); await wait(3000); },
  async editorAdd() { session(); await load("/index.html?edit"); await wait(2500); const b = Dq('[data-sub="add"]'); if (b) b.click(); await wait(800); },
  async settings() { session(); await load("/admin.html#settings"); await wait(1800); },
  async team() { session(); await load("/admin.html#team/u-store"); await wait(1800); },
  async activity() { session(); await load("/admin.html#activity"); await wait(1800); },
  async stylistSeed() { localStorage.removeItem("mlb_admin_sess"); await load("/index.html"); await wait(1500); sessionStorage.clear(); const S2 = W().MLB_STYLIST; S2.open(); for (const m of ["Office look under LE 2,000", "3ayza fostan eswed lel fara7", "كوتشي ابيض", "how long does delivery take?", "KAVA", "عندكم زارا؟", "bust 90 waist 72 hips 98", "amaza", "winter coats on sale"]) { S2.respond(m); await wait(1400); } await wait(800); },
  async stylistOverview() { session(); await load("/admin.html#stylist/overview"); await wait(2200); },
  async stylistReplies() { session(); await load("/admin.html#stylist/replies"); await wait(2200); },
  async stylistKnowledge() { session(); await load("/admin.html#stylist/knowledge"); await wait(2200); },
  async stylistAdmin() { session(); await load("/admin.html#stylist"); await wait(2000); },
};
// store screens are shot as a visitor (no team bar)
const STORE = ["home", "homeChoices", "search", "market", "brands", "product", "stylist", "bag", "checkout", "payment", "invoice", "account", "sell"];
if (STORE.includes(s)) localStorage.removeItem("mlb_admin_sess");
(S[s] || S.home)().then(() => { document.title = "ready"; });
</script>
</body>
</html>
